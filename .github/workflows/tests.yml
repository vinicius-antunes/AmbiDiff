name: Testes AmbiDiff

on:
  push:
    branches:
      - perf/otimizacao-varredura
      - chore/infra-codex-agents-skills-ci
  pull_request:
    branches:
      - main
      - perf/otimizacao-varredura
      - chore/infra-codex-agents-skills-ci
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  tests:
    name: Windows / Python 3.12
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Configurar Node para verificação de sintaxe
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar dependências do projeto
        run: python -m pip install -r requirements.txt
      - name: Instalar somente Chromium
        run: python -m playwright install chromium
      - name: Verificar JavaScript
        run: node --check web/static/app.js
      - name: Executar suíte local existente
        run: python -B -m unittest discover -s tests -v
